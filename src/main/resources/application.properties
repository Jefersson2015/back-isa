# CONFIGURACIÓN GENERAL
spring.application.name=elite-backend
server.port=8080

# CONEXIÓN A MYSQL
# En producción, estas variables vendrán del hosting (Render)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/elite?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / HIBERNATE
# validate: verifica que las entidades coincidan con la BD, pero NO las modifica
spring.jpa.hibernate.ddl-auto=validate

# Mostrar SQL en consola (útil para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto para MariaDB (compatible con MySQL también)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect